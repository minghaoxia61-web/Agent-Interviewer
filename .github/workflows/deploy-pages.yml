# 前端静态构建并发布到 GitHub Pages。
# 注意：Pages 只能托管静态前端（UI 演示）；FastAPI 后端 + LLM 需另行托管，
# 之后在仓库 Variables 里设置 VITE_API_BASE 指向后端即可让线上前端连上真实数据。
name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build with Pages base path
        run: npm run build:pages
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
