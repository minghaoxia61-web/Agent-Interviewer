# 后端 pytest + 前端构建，双作业并行
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run pytest
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image（验证 Dockerfile 与 pip 依赖解析）
        run: docker build -t rai-ci-test .
      - name: Smoke check（容器内健康检查）
        run: |
          docker run -d --name rai-ci -p 8000:7860 -e RETRIEVER_MODE=bm25 rai-ci-test
          for i in $(seq 1 20); do
            sleep 2
            if curl -sf http://localhost:8000/api/health > /dev/null; then echo OK; exit 0; fi
          done
          echo "health check failed"; docker logs rai-ci; exit 1

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
