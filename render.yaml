# Render Blueprint：在 Render 控制台选择 New → Blueprint 即可按本文件一键部署，
# 或手动 New → Web Service 选择仓库（runtime 自动识别 Dockerfile）。
#
# 免费层说明：
# - 服务闲置 15 分钟会休眠，首次访问冷启动约 30-60 秒；
# - 免费实例 512MB 内存，本应用（Mock 或真实 LLM 模式）均够用；
# - WebSocket 流式面试在免费层可用。
services:
  - type: web
    name: rai-workbench
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ACCESS_TOKEN
        sync: false        # 部署时在面板填写（必设，保护 LLM 费用）
      - key: LLM_API_KEY
        sync: false        # 留空 = Mock 模式
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: RETRIEVER_MODE
        value: bm25        # 容器内离线启动更快；需要向量检索时改回 auto/chroma
