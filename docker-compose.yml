services:
  rai:
    build: .
    ports:
      # 容器内默认监听 7860（魔搭/HF 创空间约定端口），宿主机映射到 8000
      - "8000:7860"
    env_file:
      - .env
    volumes:
      # 轨迹与报告持久化到宿主机
      - ./data/traces:/app/data/traces
      - ./data/reports:/app/data/reports
      - ./data/uploads:/app/data/uploads
    restart: unless-stopped
